<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slope 3D - Touch Edition</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <script src="TemplateData/UnityProgress.js"></script>
    <script src="Build/UnityLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #gameContainer { width: 100vw; height: 100vh; }
        .touch-zone { position: absolute; top: 0; bottom: 0; width: 50%; z-index: 999; }
        #left-btn { left: 0; } #right-btn { right: 0; }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="left-btn" class="touch-zone"></div>
    <div id="right-btn" class="touch-zone"></div>
    <script>
        var gameInstance = UnityLoader.instantiate("gameContainer", "Build/slope.json");
        function sendKey(key, type) {
            const e = new KeyboardEvent(type, { key: key, code: key, bubbles: true });
            document.querySelector("canvas").dispatchEvent(e);
        }
        document.getElementById("left-btn").addEventListener("touchstart", (e) => { e.preventDefault(); sendKey("ArrowLeft", "keydown"); });
        document.getElementById("left-btn").addEventListener("touchend", () => sendKey("ArrowLeft", "keyup"));
        document.getElementById("right-btn").addEventListener("touchstart", (e) => { e.preventDefault(); sendKey("ArrowRight", "keydown"); });
        document.getElementById("right-btn").addEventListener("touchend", () => sendKey("ArrowRight", "keyup"));
    </script>
</body>
</html>
