<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Slope 3D - iPad Touch Edition</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #game-container { width: 100vw; height: 100vh; }
        /* Touch Overlay Zones */
        .touch-zone {
            position: absolute; top: 0; bottom: 0; width: 50%; z-index: 10;
            -webkit-tap-highlight-color: transparent;
        }
        #left-zone { left: 0; }
        #right-zone { right: 0; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <!-- Touch Zones for iPad -->
    <div id="left-zone" class="touch-zone"></div>
    <div id="right-zone" class="touch-zone"></div>

    <script src="Build/UnityLoader.js"></script>
    <script>
        // Load the original Unity game
        var unityInstance = UnityLoader.instantiate("unity-canvas", "Build/Slope.json");

        // Touch Control Logic
        function simulateKey(code, type) {
            window.dispatchEvent(new KeyboardEvent(type, {
                key: code, keyCode: (code === "ArrowLeft" ? 37 : 39),
                code: code, which: (code === "ArrowLeft" ? 37 : 39),
                bubbles: true
            }));
        }

        const left = document.getElementById("left-zone");
        const right = document.getElementById("right-zone");

        left.addEventListener("touchstart", (e) => { e.preventDefault(); simulateKey("ArrowLeft", "keydown"); });
        left.addEventListener("touchend", () => simulateKey("ArrowLeft", "keyup"));
        
        right.addEventListener("touchstart", (e) => { e.preventDefault(); simulateKey("ArrowRight", "keydown"); });
        right.addEventListener("touchend", () => simulateKey("ArrowRight", "keyup"));
    </script>
</body>
</html>
